<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="wa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="wa-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#25D366" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="116" fill="#0B1410" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#25D366" stroke-width="4" stroke-opacity="0.25" />

  <!-- Vabsgen Ribbon V Mark -->
  <g filter="url(#glow)">
    <!-- Left Wing -->
    <path d="M 90 170 C 105 145 155 145 185 180 L 256 355 L 210 380 C 165 380 115 305 90 220 Z" fill="url(#wa-grad)" />
    <!-- Right Wing -->
    <path d="M 422 170 C 407 145 357 145 327 180 L 256 355 L 302 380 C 347 380 397 305 422 220 Z" fill="url(#wa-grad)" />
    <!-- Center Ribbon Fold Curve -->
    <path d="M 185 180 C 220 235 240 290 256 355 C 272 290 292 235 327 180 C 302 165 280 185 256 230 C 232 185 210 165 185 180 Z" fill="url(#wa-fold)" />
  </g>
</svg>
